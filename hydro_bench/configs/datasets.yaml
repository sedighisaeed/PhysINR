# Datasets known to HydroBench.
#
# `root` may be overridden by the CLI (--dataset-root) or the HYDROBENCH_DATA
# environment variable. Every entry must point to a directory whose layout is
# described in `docs/DATASETS.md`; the DatasetManager verifies it against an
# immutable manifest (sha256 + split lists) before any metric is computed.

datasets:
  # Synthetic stand-in used for installation tests. Physically plausible
  # Jaffe-McGlamery degradation of a clear scene; generated by
  # scripts/make_synthetic_benchmark.py. Real datasets cannot be redistributed.
  SynthUIB:
    type: paired
    root: ${ENV:HYDROBENCH_DATA}/SynthUIB
    structure:
      raw: raw_input_imgs
      gt:  reference_imgs
    splits: ${MANIFEST:datasets/manifests/synthuib.json}
    description: "Synthetic paired underwater benchmark (smoke-test fixture)."

  UIEB:
    type: paired                 # paired (FR metrics available) | unpaired (NR only)
    root: ${ENV:HYDROBENCH_DATA}/UIEB
    structure:
      raw: raw_input_imgs        # degraded / in-the-wild inputs
      gt:  reference_imgs        # ground truth (clean) images
      challenge: challenge_imgs  # 60 no-reference challenge images
    splits: ${MANIFEST:datasets/manifests/uieb.json}
    description: "Underwater Image Enhancement Benchmark, 890 paired + 60 challenge."

  # The whole 890-image reference set as one evaluation split, with no
  # train/val/test partition. The canonical T90 subset used throughout the
  # literature is not recoverable from the distribution (the 90 image ids are
  # not shipped), so the full set is reported instead: it is well-defined and
  # strictly larger. Every method is evaluated on the same 890, and the
  # train/test leakage caveat for UIEB-trained methods still applies.
  UIEB-890:
    type: paired
    root: ${ENV:HYDROBENCH_DATA}/UIEB
    structure:
      raw: raw_input_imgs
      gt:  reference_imgs
      challenge: challenge_imgs
    splits: ${MANIFEST:datasets/manifests/uieb_full890.json}
    description: "UIEB full 890-image reference set, single evaluation split."

  EUVP:
    type: paired
    root: ${ENV:HYDROBENCH_DATA}/EUVP
    structure:
      raw: train_val/underwater_dark
      gt:  train_val/GT
    splits: ${MANIFEST:datasets/manifests/euvp.json}
    description: "Enhancing Underwater Visual Perception (paired scenes + dark/imagenet sets)."

  LSUI:
    type: paired
    root: ${ENV:HYDROBENCH_DATA}/LSUI
    structure:
      raw: input
      gt:  GT
    splits: ${MANIFEST:datasets/manifests/lsui.json}
    description: "Large-Scale Underwater Image dataset (4000+ paired samples)."

  UFO-120:
    type: paired
    root: ${ENV:HYDROBENCH_DATA}/UFO-120
    structure:
      raw: ufo120
      gt:  ufo120_gt
    splits: ${MANIFEST:datasets/manifests/ufo120.json}
    description: "Underwater Forward-looking sonar / optical 1200-image paired set."

  RUIE:
    type: unpaired
    root: ${ENV:HYDROBENCH_DATA}/RUIE
    structure:
      raw: RUIE_raw
    splits: ${MANIFEST:datasets/manifests/ruie.json}
    description: "Real-world Underwater Image Enhancement (no reference)."

  UCCS:
    type: unpaired
    root: ${ENV:HYDROBENCH_DATA}/UCCS
    structure:
      raw: color_cast
    splits: ${MANIFEST:datasets/manifests/uccs.json}
    description: "Underwater Color Cast Set."

  # ---- Downstream application datasets -------------------------------------
  SUIM:
    type: segmentation
    root: ${ENV:HYDROBENCH_DATA}/SUIM
    structure:
      images: train_val/images
      masks:  train_val/masks
    classes: [background, human/diver, aquatic plant/sea-grass, wreck/ruins, robot/instruments, reef/invertebrates, fish, sea-floor]
    splits: ${MANIFEST:datasets/manifests/suim.json}
    description: "Underwater semantic segmentation (SUIM)."

  DUO:
    type: detection
    root: ${ENV:HYDROBENCH_DATA}/DUO
    structure:
      images: test/images
      labels: test/labels        # YOLO-format .txt
    classes: [echinus, holothurian, scallop, starfish]
    splits: ${MANIFEST:datasets/manifests/duo.json}
    description: "Dataset for Underwater Object detection (DUO / URPC)."
