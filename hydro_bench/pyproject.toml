[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-bench"
version = "0.1.0"
description = "HydroBench: a reproducible benchmarking framework for Underwater Image Restoration and Enhancement"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["underwater image enhancement", "image restoration", "benchmark", "image quality assessment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "opencv-python-headless>=4.5",
    "scikit-image>=0.18",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "pandas>=1.3",
    "pyyaml>=5.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
torch = ["torch>=1.7", "torchvision>=0.8"]
lpips = ["lpips>=0.1.4"]
detection = ["ultralytics>=8.0"]
dev = ["pytest>=6.0"]

[project.scripts]
hydro-bench = "run_benchmark:main"

[tool.setuptools.packages.find]
include = ["hydro_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
